{% extends 'base.html' %}

{% block content %}
<div class="text-center mt-5">
    <h4 class="mb-5">Какое у тебя настроение?</h4>
    
    <div class="d-flex justify-content-center mb-4">
        <select class="form-select w-50 text-center">
            <option>Радость (нажмите, чтобы выбрать)</option>
            <option>Спокойствие</option>
            <option>Усталость</option>
            <option>Тревога</option>
            <option>Вдохновение</option>
            <option>Грусть</option>
        </select>
    </div>

    <button class="btn btn-outline-dark px-5 py-2">Получить прогноз</button>

    <div class="card mx-auto mt-5 shadow" style="max-width: 600px; background: linear-gradient(135deg, #FFFACD, #87CEFA, #FFB6C1); border: 2px solid #333;">
    <div class="card-body text-start p-4">
        <p class="text-muted mb-4">(Фон карточки меняется на цвет удачи, например, желтый)</p>
        
        <!-- Это тот белый блок с текстом, который мы поправили выше -->
        <div class="bg-white p-3 rounded mb-4 shadow-sm" style="max-width: 450px;">
            <p class="mb-1 fw-bold">Текст гороскопа:</p>
            <p class="fst-italic mb-0">"Сегодня отличный день для новых начинаний..."</p>
        </div>

        <div class="d-flex align-items-center mb-4">
            <span class="me-3">Цвет удачи:</span>
            <span class="px-4 py-2 border border-dark text-dark fw-bold" style="background: linear-gradient(135deg, #FFFACD, #87CEFA, #FFB6C1);">Весенний бриз</span>
        </div>

        <button class="btn btn-light border-dark mt-2 fw-bold text-dark">Подобрать образ</button>
    </div>
</div>
</div>
{% endblock %}
