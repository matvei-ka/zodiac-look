{% extends 'base.html' %}

{% block content %}
<div class="text-center mt-5">
    <h4 class="mb-5">Какое у тебя настроение?</h4>
    
    <div class="d-flex justify-content-center mb-4">
        <select class="form-select w-50 text-center">
            <option>Радость (нажмите, чтобы выбрать)</option>
            <option>Спокойствие</option>
            <option>Усталость</option>
            <option>Тревога</option>
            <option>Вдохновение</option>
            <option>Грусть</option>
        </select>
    </div>

    <button class="btn btn-outline-dark px-5 py-2">Получить прогноз</button>

    <div class="card mx-auto mt-5 shadow" style="max-width: 600px; background-color: #FFFACD; border: 2px solid #333;">
        <div class="card-body text-start p-4">
            <p class="text-muted mb-4">(Фон карточки меняется на цвет удачи, например, желтый)</p>
            
            <p class="mb-1">Текст гороскопа:</p>
            <p class="fst-italic mb-4">"Сегодня отличный день для новых начинаний..."</p>
            
            <div class="d-flex align-items-center mb-4">
                <span class="me-3">Цвет удачи:</span>
                <span class="border border-dark px-4 py-2 bg-white">Желтый</span>
            </div>

            <button class="btn btn-outline-dark mt-2">Подобрать образ</button>
        </div>
    </div>
</div>
{% endblock %}
