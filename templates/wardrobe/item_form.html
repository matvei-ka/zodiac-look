{% extends 'base.html' %}

{% block title %}{{ title }} — Астропрогноз{% endblock %}

{% block content %}
<div class="card shadow mx-auto mt-4" style="max-width: 560px;">
    <div class="card-body p-4">
        <h3 class="mb-4">{{ title }}</h3>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-success">Сохранить</button>
            <a href="{% url 'wardrobe:wardrobe_list' %}" class="btn btn-link">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
