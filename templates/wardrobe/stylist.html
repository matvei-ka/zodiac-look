{% extends 'base.html' %}

{% block content %}
<div class="mt-4 border border-dark p-4 bg-white">
    <div class="d-flex align-items-center mb-4">
        <label class="me-3 fw-bold">Выбери повод:</label>
        <select class="form-select w-25 me-3">
            <option>Прогулка</option>
        </select>
        <button class="btn btn-outline-dark">Подобрать образ</button>
    </div>

    <div class="mt-4 ms-2">
        <p class="mb-2">Оценка соответствия: 85%</p>
        <p class="mb-1">Верх: Белая рубашка (совпадает с цветом удачи)</p>
        <p class="mb-1">Низ: Джинсы (подходит под повод)</p>
        <p class="mb-1">Обувь: Кроссовки</p>
        <p class="mb-1">Аксессуар: Сумка</p>
    </div>

    <div class="text-end mt-4">
        <button class="btn btn-outline-dark">Сохранить</button>
    </div>
</div>
{% endblock %}
